# Cloudflare Worker voor "Inloggen met GitHub" (Webcraft).
# Uitrollen (eenmalig): npx wrangler deploy   (vanuit de map worker/)
# Het client secret NOOIT hier invullen, maar als secret instellen:
#   npx wrangler secret put GITHUB_CLIENT_SECRET
name = "webcraft-login"
main = "oauth-worker.js"
compatibility_date = "2025-01-01"

[vars]
# Client ID van je GitHub App (niet geheim)
GITHUB_CLIENT_ID = ""
# Website(s) die mogen inloggen, komma-gescheiden, zonder / aan het eind
ALLOWED_ORIGINS = "https://www.example.nl"
# Alleen invullen bij een gewone OAuth App ("repo"). Bij een GitHub App leeg laten.
# OAUTH_SCOPE = "repo"
