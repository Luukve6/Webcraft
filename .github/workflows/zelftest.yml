# CMS-zelftest tegen de échte GitHub API
# Draait alleen bij een push naar de branch "cms-zelftest" of handmatig.
# Gebruikt dezelfde code als /admin om echte commits te maken op die branch
# (pagina aanmaken, online zetten, foto uploaden, hernoemen, verwijderen),
# en zet het resultaat in zelftest/resultaat.json op die branch.
# Commits gemaakt met de GITHUB_TOKEN starten geen nieuwe workflows, dus dit loopt niet rond.
name: CMS-zelftest

on:
  push:
    branches: [cms-zelftest]
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: read

jobs:
  zelftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Echte GitHub-test
        run: node scripts/github-selftest.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CMS_BRANCH: ${{ github.ref_name }}
