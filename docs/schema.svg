<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <title>Werking van Webcraft met Cloudflare Access en KV</title>
  <rect width="920" height="350" fill="#ffffff"/>
  <defs><marker id="pijl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1d2327"/></marker></defs>
  <rect x="30" y="50" width="190" height="100" rx="12" fill="#e9f2fa" stroke="#2271b1" stroke-width="2"/>
  <text x="125" y="82" text-anchor="middle" font-weight="700">Beheerder</text><text x="125" y="106" text-anchor="middle">op /admin</text><text x="125" y="130" text-anchor="middle" font-size="12" fill="#646970">e-mail + eenmalige code</text>
  <rect x="285" y="50" width="190" height="100" rx="12" fill="#fff3e6" stroke="#f6821f" stroke-width="2"/>
  <text x="380" y="82" text-anchor="middle" font-weight="700">Cloudflare Access</text><text x="380" y="106" text-anchor="middle">controleert toegang</text><text x="380" y="130" text-anchor="middle" font-size="12" fill="#646970">alleen toegestane mensen</text>
  <rect x="540" y="50" width="190" height="100" rx="12" fill="#fff3e6" stroke="#f6821f" stroke-width="2"/>
  <text x="635" y="82" text-anchor="middle" font-weight="700">Pages Functions</text><text x="635" y="106" text-anchor="middle">lezen, valideren, opslaan</text><text x="635" y="130" text-anchor="middle" font-size="12" fill="#646970">/admin/api</text>
  <rect x="795" y="50" width="95" height="100" rx="12" fill="#f3f0ff" stroke="#6b57b7" stroke-width="2"/>
  <text x="842" y="88" text-anchor="middle" font-weight="700">KV</text><text x="842" y="112" text-anchor="middle" font-size="12">inhoud</text><text x="842" y="130" text-anchor="middle" font-size="12">versies</text>
  <rect x="285" y="225" width="190" height="82" rx="12" fill="#edfaef" stroke="#00a32a" stroke-width="2"/>
  <text x="380" y="257" text-anchor="middle" font-weight="700">Bezoeker</text><text x="380" y="281" text-anchor="middle">op de website</text>
  <rect x="540" y="225" width="190" height="82" rx="12" fill="#fff3e6" stroke="#f6821f" stroke-width="2"/>
  <text x="635" y="257" text-anchor="middle" font-weight="700">Pages Functions</text><text x="635" y="281" text-anchor="middle">serveert actuele inhoud</text>
  <line x1="220" y1="100" x2="281" y2="100" stroke="#1d2327" stroke-width="2" marker-end="url(#pijl)"/><line x1="475" y1="100" x2="536" y2="100" stroke="#1d2327" stroke-width="2" marker-end="url(#pijl)"/><line x1="730" y1="100" x2="791" y2="100" stroke="#1d2327" stroke-width="2" marker-end="url(#pijl)"/>
  <line x1="475" y1="266" x2="536" y2="266" stroke="#1d2327" stroke-width="2" marker-end="url(#pijl)"/><path d="M730 266 H842 V154" fill="none" stroke="#1d2327" stroke-width="2" marker-end="url(#pijl)"/><text x="755" y="244" font-size="12" fill="#646970">actuele inhoud</text>
